# Compliance ruleset — Divya Patel's Digital University + Affiliate Program
# Governing: ASCI Code · Consumer Protection Act 2019 · Meta Advertising Policies
# Consumed by compliance/validate.py.

business:
  name: "Divya Patel's Digital University"
  type: "Digital education courses + affiliate marketing program"
  model: "Course purchase → lifetime access + government certification + automatic affiliate partner (70% commission per referral)"
  offer: "21st-century digital & social media courses"
  price_range: "Affordable / cheapest in market"
  certification: "Government certification (specify which body)"
  affiliate_commission: "70% per person referred"
  target_audience: "Students, housewives, business owners, job holders wanting extra income — educated, somewhat serious people"
  lead_channel: "Instagram DMs / WhatsApp after seeing Meta ads"
  no_target_pressure: true
  not_chain_system: true

governing:
  - ASCI (Advertising Standards Council of India) Code
  - Consumer Protection Act 2019
  - Meta Advertising Policies (Business Opportunities)
  - ASCI Guidelines on Education Sector Advertising
  - Information Technology Act 2000 (digital ads)

# ── Rule 1 — Income Claims (ASCI + Meta + Consumer Protection Act) ──────────
income_claims:
  rule: "Cannot guarantee or promise specific income amounts without disclaimers"
  allowed_patterns:
    - "earning potential"
    - "earning opportunity"
    - "income opportunity"
    - "you can earn"
    - "कमाई का मौका"
    - "कमाने का अवसर"
  banned:
    - "guaranteed income"
    - "guarantee ₹"
    - "you will earn ₹"
    - "earn ₹X per month guaranteed"
    - "पक्की कमाई"
    - "गारंटीड इनकम"
    - "100% earning"
  disclaimer_required: "Individual results may vary. Income depends on effort, skills, and market conditions."
  disclaimer_hindi: "व्यक्तिगत परिणाम भिन्न हो सकते हैं। आय प्रयास, कौशल और बाज़ार की स्थितियों पर निर्भर करती है।"

# ── Rule 2 — Employment / Job Guarantees (ASCI Education Guidelines) ────────
employment_claims:
  banned:
    - "100% job guarantee"
    - "guaranteed placement"
    - "job pakki"
    - "नौकरी पक्की"
    - "placement guaranteed"
    - "get hired immediately"
    - "तुरंत नौकरी"
  allowed:
    - "career support"
    - "placement assistance"
    - "job-ready skills"
    - "career guidance"
    - "interview preparation"

# ── Rule 3 — Certification Claims (must be verifiable) ─────────────────────
certification:
  rule: "Certification claims must name the actual issuing body and be verifiable"
  banned:
    - "government certified"       # too vague — which government body?
    - "internationally recognized"  # which organization?
    - "ISO certified course"       # ISO doesn't certify courses
    - "सरकारी मान्यता प्राप्त"     # unless specifying which body
  allowed:
    - "Certificate from [specific body name]"
    - "NSDC certified"
    - "Skill India partner"
    - "Certification upon completion"
  note: "Always name the specific certifying body. 'Government certification' alone is misleading unless backed by NSDC/Skill India/UGC recognition."

# ── Rule 4 — Testimonials & Social Proof (ASCI) ───────────────────────────
testimonials:
  rules:
    - "Must be from real, verifiable students"
    - "Income testimonials must represent TYPICAL results, not exceptional"
    - "Paid/incentivized testimonials must be disclosed"
    - "Screenshots of income must be genuine and unedited"
    - "Cannot use stock photos as 'student' testimonials"
  banned:
    - "everyone earns ₹"
    - "सबकी कमाई"
    - "all students earn"
    - "100% success rate"
  disclaimer_for_income_testimonials: "Results shown are of specific individuals. Your results may vary based on effort and market conditions."

# ── Rule 5 — Urgency / Scarcity (must be genuine) ─────────────────────────
urgency_scarcity:
  rule: "Urgency/scarcity claims must be genuine — fake countdown timers and fabricated seat limits are misleading advertising under Consumer Protection Act 2019"
  banned_if_fake:
    - "only X seats left"          # ok if actually true
    - "offer expires today"        # ok if actually expires
    - "last chance"
    - "batch closing"
  note: "These are allowed ONLY when genuinely true. Perpetual 'last 5 seats' is deceptive."

# ── Rule 6 — MLM / Chain / Pyramid Disclosure (Meta + Consumer Protection) ─
affiliate_disclosure:
  rule: "Must clearly state this is affiliate marketing (referral-based commission), NOT employment, NOT a chain/pyramid system"
  required_disclosures:
    - "This is an affiliate/referral program, not employment"
    - "Commission is per referral, not residual/recurring"
    - "No joining fee required to become affiliate (comes with course)"
  banned:
    - "passive income"             # it requires active referral work
    - "money while you sleep"
    - "बिना मेहनत कमाओ"
    - "no work needed"
    - "just sit and earn"
    - "chain system"               # Divya herself says it's NOT a chain
    - "network marketing"          # could trigger Meta's MLM filters
    - "पैसा ही पैसा"
  meta_policy_note: "Meta classifies 'business opportunity' ads separately. Avoid language that makes it sound like MLM/pyramid. Emphasize the COURSE VALUE, not just the earning."

# ── Rule 7 — Free / No-Cost Claims ────────────────────────────────────────
free_claims:
  banned:
    - "free course"                # unless genuinely free
    - "no cost at all"
    - "बिल्कुल मुफ्त"
    - "zero investment"            # the course has a price
  note: "The course has a price. The affiliate program is free WITH the course purchase, but the course itself is not free."

# ── Rule 8 — Meta Platform-Specific Rules ─────────────────────────────────
meta_platform:
  special_ad_category: false       # education is NOT a special category on Meta (employment IS)
  notes:
    - "Income opportunity ads face extra review — keep claims modest"
    - "Avoid 'get rich quick' language — triggers automated rejection"
    - "Before/after income comparisons allowed but need disclaimers"
    - "Personal attributes targeting (age, gender) limited for some ad types"

# ── Banned words / phrases (Layer 1 regex check) ──────────────────────────
verbs:
  banned:
    - "guaranteed income"
    - "guaranteed earning"
    - "guaranteed job"
    - "guaranteed placement"
    - "100% job"
    - "100% placement"
    - "100% earning"
    - "get rich quick"
    - "get rich fast"
    - "easy money"
    - "quick money"
    - "passive income"
    - "money while you sleep"
    - "no work needed"
    - "zero effort"
    - "just sit and earn"
    - "lakhs guaranteed"
    - "crores guaranteed"
  banned_hindi:
    - "गारंटीड इनकम"
    - "पक्की नौकरी"
    - "बिना मेहनत"
    - "बैठे बैठे कमाओ"
    - "पैसा ही पैसा"
    - "लाखों की गारंटी"
    - "करोड़ों कमाओ"
    - "आसान पैसा"
    - "बिल्कुल मुफ्त"

# ── Timeline / get-rich patterns (always flag) ────────────────────────────
timeline_patterns:
  - "earn \\d+.*in \\d+\\s*(day|days|week|weeks|month|months)"
  - "\\d+\\s*(दिन|हफ़्ते|हफ्ते|महीने|माह)\\s*में.*कमा"
  - "start earning.*immediately"
  - "income from day 1"
  - "first day.*earn"
  - "पहले दिन से.*कमाई"
  - "तुरंत कमाना शुरू"

# ── Headline types ────────────────────────────────────────────────────────
headline_types:
  A: "Aspiration / lifestyle — paints the life after learning. SAFEST."
  B: "Problem-agitation — names the consumer's current frustration (9-5, low salary, no skills). ALLOWED."
  C: "Specific benefit — names what the course teaches or the earning model. ALLOWED with disclaimers."
  D: "BANNED — guaranteed income, get-rich-quick, fake urgency, MLM language."
headline_examples:
  A: ["Turn your passion into a career.", "Your skills, your future.", "अपने सपनों को उड़ान दो", "डिजिटल दुनिया में अपनी पहचान बनाओ"]
  B: ["Tired of the 9 to 5?", "Salary not enough?", "नौकरी से थक गए?", "महीने के आखिर में पैसे खत्म?"]
  C: ["Learn digital marketing + earn 70% commission", "21st century skills + government certification", "डिजिटल कोर्स सीखो, फ्रीलांसिंग करो"]

# ── Disclaimer ────────────────────────────────────────────────────────────
disclaimer:
  text_en: "*Individual results may vary. Income depends on effort, skills, and market conditions. This is not a job offer."
  text_hi: "*व्यक्तिगत परिणाम भिन्न हो सकते हैं। आय प्रयास, कौशल और बाज़ार की स्थितियों पर निर्भर करती है। यह नौकरी का प्रस्ताव नहीं है।"
  required_when:
    - "Any income figure or earning potential is mentioned"
    - "Any testimonial about income is shown"
    - "Before/after lifestyle comparison implies income change"
    - "Affiliate commission structure is mentioned"
