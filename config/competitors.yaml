# Competitors to scan for ad roots — Digital Education / Affiliate Marketing space.
# Adapted for Divya Patel's digital university + affiliate business.
#
# tier:
#   every_run   -> scanned on every `run.py scan` and the daily refresh
#   broad_only  -> scanned only with `run.py scan --broad`
#
# page_ids:  exact Meta Ad Library advertiser page id(s). STRONGLY preferred.
# search:    fallback keyword when page_ids is empty.

